<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Agent głosowy</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --me:#2b5cff; --ai:#262a33; --text:#f2f3f5; --muted:#8b93a3; --accent:#ff3b5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #22262f; }
  header h1 { font-size:17px; margin:0; }
  header button { background:none; border:1px solid #333a47; color:var(--muted); border-radius:8px; padding:6px 10px; font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.4; white-space:pre-wrap; font-size:16px; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:var(--ai); border-bottom-left-radius:4px; }
  .sys { align-self:center; color:var(--muted); font-size:13px; text-align:center; }
  .err { color:#ff8a8a; }
  footer { padding:12px 16px 16px; border-top:1px solid #22262f; display:flex; flex-direction:column; gap:10px; }
  #status { text-align:center; color:var(--muted); font-size:14px; min-height:18px; }
  #mic { width:96px; height:96px; border-radius:50%; border:none; margin:0 auto; background:var(--me); color:#fff;
         font-size:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px rgba(43,92,255,.4);
         -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  #mic.rec { background:var(--accent); box-shadow:0 0 0 10px rgba(255,59,92,.25); animation:pulse 1.2s infinite; }
  #mic:disabled { opacity:.5; }
  @keyframes pulse { 0%{box-shadow:0 0 0 6px rgba(255,59,92,.3)} 50%{box-shadow:0 0 0 16px rgba(255,59,92,.08)} 100%{box-shadow:0 0 0 6px rgba(255,59,92,.3)} }
  .row { display:flex; gap:8px; }
  .row input { flex:1; background:var(--card); border:1px solid #333a47; color:var(--text); border-radius:10px; padding:10px 12px; font-size:16px; }
  .row button { background:var(--card); border:1px solid #333a47; color:var(--text); border-radius:10px; padding:10px 14px; font-size:15px; }
  label.sw { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; justify-content:center; }
</style>
</head>
<body>
<header>
  <h1>🎙️ Agent głosowy · Claude Code</h1>
  <button id="reset">Nowa rozmowa</button>
</header>
<div id="log"></div>
<footer>
  <div id="status">Dotknij mikrofonu i mów. Dotknij ponownie, aby wysłać.</div>
  <button id="mic" aria-label="Nagrywaj">🎤</button>
  <label class="sw"><input type="checkbox" id="speak" checked> czytaj odpowiedzi na głos</label>
  <div class="row">
    <input id="text" placeholder="…albo napisz wiadomość" autocomplete="off">
    <button id="send">Wyślij</button>
    <button id="stop" title="Przerwij czytanie">⏹</button>
  </div>
</footer>
<audio id="player" playsinline></audio>
<script src="app.js"></script>
</body>
</html>
